[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "inspectai"
version = "1.0.0-rc1"
description = "AI-powered property inspection platform using classical computer vision and Google Gemini"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jayantilal", email = "contact@inspectai.dev" },
]
keywords = [
    "property-inspection",
    "computer-vision",
    "gemini-ai",
    "streamlit",
    "damage-detection",
    "ai-inspection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "streamlit==1.55.0",
    "opencv-python-headless==4.13.0.92",
    "numpy==2.3.3",
    "Pillow==12.0.0",
    "google-generativeai==0.8.6",
    "python-dotenv==1.2.2",
    "reportlab==5.0.0",
    "matplotlib==3.10.7",
    "altair==6.0.0",
    "pandas==2.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.9",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
]

[project.urls]
Homepage = "https://github.com/<your-username>/inspectai"
Documentation = "https://github.com/<your-username>/inspectai/blob/main/docs/ARCHITECTURE.md"
Repository = "https://github.com/<your-username>/inspectai"
"Bug Tracker" = "https://github.com/<your-username>/inspectai/issues"

[project.scripts]
inspectai = "streamlit_app.app:main"

# ─────────────────────────────────────────────────────────────────────────────
# Black — Code Formatter
# ─────────────────────────────────────────────────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
)/
'''

# ─────────────────────────────────────────────────────────────────────────────
# Ruff — Fast Python Linter (replaces flake8, isort, pydocstyle, etc.)
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "__pycache__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "streamlit_app/__pycache__",
    "tests/__pycache__",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "N",      # pep8-naming
    "D",      # pydocstyle
    "S",      # flake8-bandit (security)
]
ignore = [
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D107",   # Missing docstring in __init__
    "D202",   # Blank lines after function docstring (conflicts with black)
    "D203",   # 1 blank line before class docstring (conflicts with D211)
    "D212",   # Multi-line docstring summary should start at first line (conflicts with D213)
    "E501",   # Line too long (handled by black)
    "S101",   # assert used (we use pytest assertions)
    "S603",   # subprocess call (not applicable)
    "ARG001", # Unused method argument (common in Streamlit callbacks)
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001", "D", "E501"]
"streamlit_app/pages/*" = ["D", "E501"]
"streamlit_app/app.py" = ["D"]

# ─────────────────────────────────────────────────────────────────────────────
# Mypy — Static Type Checker
# ─────────────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.generativeai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "altair.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ─────────────────────────────────────────────────────────────────────────────
# Pytest — Test Framework
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may use external services)",
    "slow: Tests that take more than 1 second",
]

# ─────────────────────────────────────────────────────────────────────────────
# Coverage
# ─────────────────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["streamlit_app"]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/test_*",
    "streamlit_app/__init__.py",
    "streamlit_app/ai/__init__.py",
    "streamlit_app/database/__init__.py",
    "streamlit_app/report/__init__.py",
    "streamlit_app/utils/__init__.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
    "pass",
]

# ─────────────────────────────────────────────────────────────────────────────
# isort — Import Sorting (used by ruff, but configurable here)
# ─────────────────────────────────────────────────────────────────────────────

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["streamlit_app"]
known_third_party = ["streamlit", "cv2", "numpy", "PIL", "google", "dotenv", "reportlab", "matplotlib", "altair", "pandas"]
