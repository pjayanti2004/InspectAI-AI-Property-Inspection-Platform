# InspectAI — Docker Compose for Production
# Single-service setup suitable for Docker, Railway, and Render.

version: "3.9"

services:
  inspectai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_PATH=/app/data/inspectai.db
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-15}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./streamlit_app/uploads:/app/streamlit_app/uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
